name: checks
on: [push, pull_request]
jobs:
  synthetic-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 examples/demo-case/demo.py --check
      - run: python3 -m unittest discover -s tests -v
